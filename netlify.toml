# Redirect old flat file URL to canonical folder URL
[[redirects]]
  from = "/passport-photo.html"
  to = "/passport-photo/"
  status = 301
  force = true

[[redirects]]
  from = "http://lovepdfs.in/*"
  to = "https://lovepdfs.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.lovepdfs.in/*"
  to = "https://lovepdfs.in/:splat"
  status = 301
  force = true

